name: 채점 갱신 (개장 후·마감 후)

# 한국 정규장은 15:30에 끝난다. 07:10 UTC(= 16:10 KST)에 돌려 그날 종가로 예측을 채점하고
# 보고서를 새로 발행한다. 15:40 이후여야 야후의 당일 봉이 완성으로 처리된다(노트북의 미완성 봉 제거 규칙).
#
# 09:37 회차는 시가 확정 직후라 시초가 예측만 채점하고, 16:10 회차는 종가로 나머지를 채점한다.
# 새 예측은 만들지 않는다. 원장은 날짜별 '최초 사전 예측'만 집계하는데, 오후 예측에는 그날 밤
# 미국 장 정보가 없어 아침 06:30 예측보다 정보가 적다. 기록하면 나쁜 쪽이 채택되고 좋은 쪽이
# 중복으로 버려진다.
#
# 전 구간 워크포워드도 다시 돌리지 않는다(아침에 이미 했고 하루 사이에 달라지지 않는다).
# 대상 종목 시세만 받아 채점하고 보고서의 '어제 예측 vs 실제' 절만 바꿔 끼운다 — 1분이면 끝난다.
on:
  schedule:
    - cron: "37 0 * * 1-5"   # 09:37 KST — 개장 직후. 시가가 확정되어 시초가 예측을 채점한다.
    - cron: "10 7 * * 1-5"   # 16:10 KST — 마감 후. 종가로 나머지를 채점한다.
  workflow_dispatch:
    inputs:
      scope:
        description: "채점 범위"
        type: choice
        default: "all"
        options:
          - "all"
          - "open"
      targets:
        description: "실행할 종목"
        type: choice
        default: "samsung,sk_hynix"
        options:
          - "samsung,sk_hynix"
          - "samsung"
          - "sk_hynix"

permissions:
  contents: write
  pages: write

concurrency:
  group: afternoon-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [samsung, sk_hynix]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install pandas==3.0.5 numpy==2.5.2 yfinance==1.7.0

      # 수동 실행에서 종목을 고를 수 있게 한다. 예약 실행에는 입력이 없어 둘 다 대상이다.
      - name: 이번 종목이 대상인지 확인
        id: gate
        env:
          WANTED: ${{ inputs.targets }}
          THIS: ${{ matrix.target }}
        run: |
          wanted="${WANTED:-samsung,sk_hynix}"
          if printf ',%s,' "$wanted" | grep -q ",$THIS,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$THIS 은(는) 이번 실행 대상이 아닙니다."
          fi

      - name: 채점·보고서 절 갱신
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 09:37 회차는 시가만, 16:10 회차와 수동 실행은 전체를 채점한다.
          SCOPE: ${{ github.event.schedule == '37 0 * * 1-5' && 'open' || (inputs.scope || 'all') }}
        run: python tools/build_afternoon_update.py --target ${{ matrix.target }} --out runs/afternoon --scope "$SCOPE" --publish

      - name: Pages 재빌드 요청
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청이 거부되었습니다($code)." ;;
          esac
