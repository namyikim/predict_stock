name: 일일 보고서
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && '일일 보고서 · 수동'
      || github.event_name == 'push' && '일일 보고서 · 코드 반영'
      || (github.event.schedule == '22 21 * * 0-4' || github.event.schedule == '22 0,3,6,9,12,15,18 * * *') && '일일 보고서 · 자동 정규'
      || '일일 보고서 · 자동 재시도' }}

# 평일 아침에 종목별 보고서를 새로 만들어 GitHub Pages에 발행한다.
# 21:22 UTC(일~목) = 06:22 KST(월~금). 모델은 07:00 시점 예측으로 설계돼 있고,
# 유일한 신호원인 미국 장 마감(겨울 06:00 KST, 여름 05:00 KST)이 야후 일봉에
# 반영될 여유가 필요하다. 그보다 이르면 미완성 봉으로 판정되어 그날 미국 신호가
# 통째로 빠진다.
#
# 시각을 :22로 둔 이유: GitHub의 cron은 :00과 :30에 전 세계 요청이 몰려 가장 많이 밀리고,
# 아예 건너뛰기도 한다(2026-09-08 06:30 예정 실행은 실행 흔적조차 없었다).
# 그래서 붐비는 지점을 피하고, 한 시간 뒤에 백업 스케줄을 하나 더 건다.
# 백업은 오늘 사전 예측이 이미 원장에 있으면 아무것도 하지 않는다(tools/should_run_today.py).
#
# 원장은 09:00 KST 이후에 만들어진 예측을 '사전 예측'으로 세지 않는다(is_prospective).
# 그래서 두 스케줄 모두 09:00 전에 끝나야 하고, 종목을 병렬로 돌리며 부트스트랩 반복수를 줄인다.
#
# 코드가 바뀌면(push) 바로 다시 만든다. 손으로 Run workflow를 누르지 않아도 고친 내용이 반영된다.
# 다만 이때는 새 예측을 원장에 기록하지 않는다(PREDICT_STOCK_RECORD_FORECAST=false).
# 원장은 날짜별 최초 사전 예측만 집계하므로, 아무 때나 밀어 넣으면 그날의 공식 기록이 바뀐다.
# 보고서·데이터 커밋(docs/, forecast_history/)은 경로 필터로 제외한다. 그러지 않으면 자기 자신이
# 만든 커밋이 다시 실행을 부른다.
on:
  schedule:
    - cron: "22 21 * * 0-4"   # 06:22 KST — 본 실행(종목 보고서 + 모든 보조 보고서)
    - cron: "25 22 * * 0-4"   # 07:25 KST — 아침 백업. 09:00(사전 예측 마감) 전 두 번째 기회
    # 3시간 간격 보강. 09:22·12:22·15:22·18:22·21:22·00:22·03:22 KST.
    # GitHub cron은 한 시간 넘게 밀리거나 통째로 건너뛴다(2026-09-08 06:22 예정분은 흔적도 없었다).
    # 종목 보고서는 오늘 기록이 이미 있으면 몇 초 만에 끝나고, 검색어만 매번 새로 만든다.
    - cron: "22 0,3,6,9,12,15,18 * * *"
    # GitHub가 :22 이벤트를 버리면 15분·30분 뒤 다시 시도한다. 이미 갱신된 보고서는 게이트가
    # 즉시 건너뛰므로 모델 계산과 검색어 발행은 한 번만 수행한다.
    - cron: "37 0,3,6,9,12,15,18 * * *"
    - cron: "52 0,3,6,9,12,15,18 * * *"
  push:
    branches: [main]
    paths:
      - "samsung_direction_model_colab.ipynb"
      - "forecast_utils.py"
      - "macro_utils.py"
      - "data_sources/**"
      - "report_html.py"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/daily-report.yml"
  workflow_dispatch:
    inputs:
      targets:
        description: "실행할 종목"
        type: choice
        default: "samsung,sk_hynix"
        options:
          - "samsung,sk_hynix"
          - "samsung"
          - "sk_hynix"

permissions:
  contents: write   # 원장·보고서를 Contents API로 커밋한다
  pages: write      # 발행 뒤 Pages 재빌드를 요청한다

# 겹쳐 돌면 같은 파일을 서로 덮어쓴다. 앞 실행이 끝날 때까지 기다린다.
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false    # 한 종목이 실패해도 다른 종목은 끝까지 돌린다
      # 병렬 실행. 종목별로 forecast_history/<종목>, docs/<종목>만 쓰므로 같은 파일을
      # 건드리지 않는다. 같은 브랜치에 동시에 커밋할 때 드물게 나는 409/422는
      # 노트북의 github_put이 sha를 다시 읽어 재시도한다.
      matrix:
        target: [samsung, sk_hynix]

    steps:
      - uses: actions/checkout@v4

      - name: 이번 종목이 대상인지 확인
        id: gate
        env:
          # 입력값은 반드시 env로 넘긴다. run 스크립트에 직접 끼워 넣으면
          # 입력이 셸 명령으로 해석될 수 있다.
          WANTED: ${{ inputs.targets }}
          THIS: ${{ matrix.target }}
        run: |
          wanted="${WANTED:-samsung,sk_hynix}"
          if printf ',%s,' "$wanted" | grep -q ",$THIS,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$THIS 은(는) 이번 실행 대상이 아닙니다."
          fi

      # 백업 스케줄(07:25 KST)은 본 실행이 이미 성공했으면 돌 필요가 없다.
      # 수동 실행은 사람이 의도한 것이므로 이 검사를 하지 않는다.
      - name: 오늘 예측이 이미 기록됐는지 확인
        id: recorded
        if: github.event_name == 'schedule' && steps.gate.outputs.run == 'true'
        run: python tools/should_run_today.py --target ${{ matrix.target }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' && steps.recorded.outputs.run != 'false'
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        if: steps.gate.outputs.run == 'true' && steps.recorded.outputs.run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pykrx는 pandas<3.0을 요구해 requirements와 충돌한다. 의존성 없이 따로 넣는다(실제로는
          # pandas 3에서도 동작). 실패해도 수급은 네이버 금융 페이지로 받으므로 실행은 계속된다.
          pip install --no-deps pykrx==1.2.8 deprecated multipledispatch || echo "::warning::pykrx 설치 실패 — 수급은 네이버 경로로 받습니다"

      - name: 보고서 생성·발행
        if: steps.gate.outputs.run == 'true' && steps.recorded.outputs.run != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          # 뉴스심리지수(한국은행 ECOS). 없거나 실패하면 그 지표만 빼고 진행한다(선택 지표).
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          # 외국인·기관 수급. KRX 정보데이터시스템 계정(무료). 없으면 네이버 금융 페이지에서 받는다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PREDICT_STOCK_TARGETS: ${{ matrix.target }}
          # 자동 감지(GITHUB_ACTIONS)로도 켜지지만, 발행 주체를 파일에 명시해 둔다.
          PREDICT_STOCK_PUBLISH: "true"
          # 자동 실행은 사람이 출력을 지켜보지 않는다. 월별 지표가 빠진 채
          # 조용히 발행되면 다른 계보의 예측이 원장에 섞인다. 차라리 실패해서
          # 메일을 받는 편이 낫다. Colab은 지금까지처럼 계속 진행한다.
          PREDICT_STOCK_MACRO_STRICT: "true"
          # 신뢰구간 폭만 조금 거칠어지고 예측값은 같다. 09:00 전에 끝내는 것이 우선이다.
          PREDICT_STOCK_BOOTSTRAP_B: "500"
          # push로 자동 실행된 회차는 보고서만 다시 만들고 원장은 건드리지 않는다.
          PREDICT_STOCK_RECORD_FORECAST: ${{ github.event_name == 'push' && 'false' || 'true' }}
          MPLBACKEND: Agg
        run: python tools/run_notebook.py --storage "runs/${{ matrix.target }}"

      - name: Pages 재빌드 요청
        if: steps.gate.outputs.run == 'true' && steps.recorded.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 보고서는 git push가 아니라 Contents API로 커밋된다. GITHUB_TOKEN이
          # 만든 커밋은 다른 워크플로를 트리거하지 않으므로, Pages 빌드가 자동으로
          # 돌지 않을 수 있다. 그래서 명시적으로 한 번 요청한다.
          # 이미 빌드가 걸려 있으면 409가 오는데 그건 실패가 아니다.
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          cat /tmp/pages.json || true
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청이 거부되었습니다($code). 브랜치 배포 설정이면 잠시 뒤 자동으로 반영될 수 있습니다." ;;
          esac

  # 예측 보고서와 독립적으로 돈다. 종목 쪽이 실패해도(예: 월별 지표 없음)
  # 검색어 보고서는 그대로 갱신되어야 한다.
  # 분기 영업이익 나우캐스트. 월별 수출이 KOSIS에 올라오는 날짜가 들쭉날쭉해서(관세청 속보 다음
  # 며칠~2주) 매달 한 번이 아니라 매일 확인한다. 영업이익 이력은 저장소 캐시를 쓰고 최근 2년만
  # 다시 받으므로 DART 요청은 종목당 8건이다.
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule' || github.event.schedule == '22 21 * * 0-4'
    strategy:
      fail-fast: false
      max-parallel: 1     # 같은 KOSIS 키로 동시에 부르면 한쪽이 거절된다
      matrix:
        target: [samsung, sk_hynix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0
      - name: 이번 분기 영업이익 추정·발행
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/build_earnings_forecast.py --target ${{ matrix.target }} --out runs/earnings --publish

  # 검색어는 하루 사이에 실제로 바뀌는 유일한 보고서라 3시간 간격 회차에도 돌린다.
  # 아침 백업(07:25) 회차만 건너뛴다 — 한 시간 전에 만든 것과 같은 내용이 된다.
  trends:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '25 22 * * 0-4'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 최근 검색어 보고서가 이미 있는지 확인
        id: trends_due
        if: github.event_name == 'schedule'
        run: python tools/should_run_trends.py

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.trends_due.outputs.run == 'true'
        with:
          python-version: "3.13"
        # 표준 라이브러리만 쓰므로 pip install이 필요 없다.

      - name: 인기 급상승 검색어 보고서
        if: github.event_name != 'schedule' || steps.trends_due.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_trends_report.py --out runs/trends --geo KR --publish

      - name: Pages 재빌드 요청
        if: github.event_name != 'schedule' || steps.trends_due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 예측 보고서 잡이 실패해도 이 커밋은 반영되어야 하므로 여기서도 요청한다.
          # 이미 빌드가 걸려 있으면 409가 오는데 그건 실패가 아니다.
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 금·은 예측. 노트북과 같은 forecast_utils를 쓰지만 LightGBM·torch는 필요 없다.
  # 종목 보고서(report)와 독립적으로 돈다. 원장은 forecast_history/gold, silver.
  metals:
    runs-on: ubuntu-latest
    # 백업 스케줄(07:25)에는 돌지 않는다. 이 잡들은 원장이 없어 '이미 기록됐는지'를
    # 판단할 수 없고, 두 번 돌면 같은 내용을 두 번 발행하게 된다.
    if: github.event_name != 'schedule' || github.event.schedule == '22 21 * * 0-4'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0 exchange_calendars==4.13.2

      - name: 금·은 예측 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_metals_report.py --out runs/metals --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 5개년 계획 분석은 시세만 새로 받는다. 종목 56개라 몇 분이면 끝난다.
  china:
    runs-on: ubuntu-latest
    # 백업 스케줄(07:25)에는 돌지 않는다. 이 잡들은 원장이 없어 '이미 기록됐는지'를
    # 판단할 수 없고, 두 번 돌면 같은 내용을 두 번 발행하게 된다.
    if: github.event_name != 'schedule' || github.event.schedule == '22 21 * * 0-4'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        # requirements.txt 전체(lightgbm·torch 등)는 필요 없다. 시세 두 패키지만 같은 버전으로.
        run: pip install pandas==3.0.5 yfinance==1.7.0

      - name: 중국 5개년 계획 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_china_report.py --out runs/china --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 위키백과 조회수는 월 단위로만 갱신되지만, 매일 돌려도 API 호출 40회로 가볍다.
  interest:
    runs-on: ubuntu-latest
    # 백업 스케줄(07:25)에는 돌지 않는다. 이 잡들은 원장이 없어 '이미 기록됐는지'를
    # 판단할 수 없고, 두 번 돌면 같은 내용을 두 번 발행하게 된다.
    if: github.event_name != 'schedule' || github.event.schedule == '22 21 * * 0-4'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        # 표준 라이브러리만 쓴다.

      - name: 장기 관심도 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_interest_report.py --out runs/interest --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac
