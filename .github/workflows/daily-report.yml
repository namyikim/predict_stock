name: 일일 보고서

# 평일 아침에 종목별 보고서를 새로 만들어 GitHub Pages에 발행한다.
# 21:30 UTC(일~목) = 06:30 KST(월~금). 모델은 07:00 시점 예측으로 설계돼 있고,
# 유일한 신호원인 미국 장 마감(겨울 06:00 KST, 여름 05:00 KST)이 야후 일봉에
# 반영될 여유가 필요하다. 그보다 이르면 미완성 봉으로 판정되어 그날 미국 신호가
# 통째로 빠진다.
#
# 원장은 09:00 KST 이후에 만들어진 예측을 '사전 예측'으로 세지 않는다(is_prospective).
# 2026-09-07 실행에서 22:00 cron이 1시간 넘게 밀린 데다 두 종목을 순차로 돌려
# 삼성전자가 09:01 KST에 끝났고, 그 예측은 집계에서 빠졌다. 그래서
#   - cron은 수십 분 밀릴 수 있으므로 06:30 KST에 걸어 07:00~07:30에 보고서가 나오게 하고,
#   - 종목을 병렬로 돌리며(종목별 경로가 달라 서로 덮어쓰지 않는다),
#   - 부트스트랩 반복수를 줄여 장 시작 전에 확실히 끝낸다.
on:
  schedule:
    - cron: "30 21 * * 0-4"
  workflow_dispatch:
    inputs:
      targets:
        description: "실행할 종목"
        type: choice
        default: "samsung,sk_hynix"
        options:
          - "samsung,sk_hynix"
          - "samsung"
          - "sk_hynix"

permissions:
  contents: write   # 원장·보고서를 Contents API로 커밋한다
  pages: write      # 발행 뒤 Pages 재빌드를 요청한다

# 겹쳐 돌면 같은 파일을 서로 덮어쓴다. 앞 실행이 끝날 때까지 기다린다.
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false    # 한 종목이 실패해도 다른 종목은 끝까지 돌린다
      # 병렬 실행. 종목별로 forecast_history/<종목>, docs/<종목>만 쓰므로 같은 파일을
      # 건드리지 않는다. 같은 브랜치에 동시에 커밋할 때 드물게 나는 409/422는
      # 노트북의 github_put이 sha를 다시 읽어 재시도한다.
      matrix:
        target: [samsung, sk_hynix]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 이번 종목이 대상인지 확인
        id: gate
        env:
          # 입력값은 반드시 env로 넘긴다. run 스크립트에 직접 끼워 넣으면
          # 입력이 셸 명령으로 해석될 수 있다.
          WANTED: ${{ inputs.targets }}
          THIS: ${{ matrix.target }}
        run: |
          wanted="${WANTED:-samsung,sk_hynix}"
          if printf ',%s,' "$wanted" | grep -q ",$THIS,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$THIS 은(는) 이번 실행 대상이 아닙니다."
          fi

      - name: 보고서 생성·발행
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          PREDICT_STOCK_TARGETS: ${{ matrix.target }}
          # 자동 감지(GITHUB_ACTIONS)로도 켜지지만, 발행 주체를 파일에 명시해 둔다.
          PREDICT_STOCK_PUBLISH: "true"
          # 자동 실행은 사람이 출력을 지켜보지 않는다. 월별 지표가 빠진 채
          # 조용히 발행되면 다른 계보의 예측이 원장에 섞인다. 차라리 실패해서
          # 메일을 받는 편이 낫다. Colab은 지금까지처럼 계속 진행한다.
          PREDICT_STOCK_MACRO_STRICT: "true"
          # 신뢰구간 폭만 조금 거칠어지고 예측값은 같다. 09:00 전에 끝내는 것이 우선이다.
          PREDICT_STOCK_BOOTSTRAP_B: "500"
          MPLBACKEND: Agg
        run: python tools/run_notebook.py --storage "runs/${{ matrix.target }}"

      - name: Pages 재빌드 요청
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 보고서는 git push가 아니라 Contents API로 커밋된다. GITHUB_TOKEN이
          # 만든 커밋은 다른 워크플로를 트리거하지 않으므로, Pages 빌드가 자동으로
          # 돌지 않을 수 있다. 그래서 명시적으로 한 번 요청한다.
          # 이미 빌드가 걸려 있으면 409가 오는데 그건 실패가 아니다.
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          cat /tmp/pages.json || true
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청이 거부되었습니다($code). 브랜치 배포 설정이면 잠시 뒤 자동으로 반영될 수 있습니다." ;;
          esac

  # 예측 보고서와 독립적으로 돈다. 종목 쪽이 실패해도(예: 월별 지표 없음)
  # 검색어 보고서는 그대로 갱신되어야 한다.
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        # 표준 라이브러리만 쓰므로 pip install이 필요 없다.

      - name: 인기 급상승 검색어 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_trends_report.py --out runs/trends --geo KR --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 예측 보고서 잡이 실패해도 이 커밋은 반영되어야 하므로 여기서도 요청한다.
          # 이미 빌드가 걸려 있으면 409가 오는데 그건 실패가 아니다.
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 금·은 예측. 노트북과 같은 forecast_utils를 쓰지만 LightGBM·torch는 필요 없다.
  # 종목 보고서(report)와 독립적으로 돈다. 원장은 forecast_history/gold, silver.
  metals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0 exchange_calendars==4.13.2

      - name: 금·은 예측 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_metals_report.py --out runs/metals --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 5개년 계획 분석은 시세만 새로 받는다. 종목 56개라 몇 분이면 끝난다.
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        # requirements.txt 전체(lightgbm·torch 등)는 필요 없다. 시세 두 패키지만 같은 버전으로.
        run: pip install pandas==3.0.5 yfinance==1.7.0

      - name: 중국 5개년 계획 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_china_report.py --out runs/china --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac

  # 위키백과 조회수는 월 단위로만 갱신되지만, 매일 돌려도 API 호출 40회로 가볍다.
  interest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        # 표준 라이브러리만 쓴다.

      - name: 장기 관심도 보고서
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_interest_report.py --out runs/interest --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          echo "HTTP $code"
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료" ;;
            *) echo "::warning::Pages 재빌드 요청 실패 ($code)" ;;
          esac
