name: 거시 경제 보고서

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macro-report.yml"
      - "tools/build_macro_report.py"
      - "tools/macro_summary.py"
      - "data_sources/fx_inputs.py"
      - "data_sources/ecos.py"
      - "data_sources/fred.py"
  schedule:
    # 평일 07:40 KST. 야후 환율은 전일 종가가 확정된 뒤여야 월평균이 흔들리지 않는다.
    - cron: "40 22 * * 0-4"
    # 그 뒤 3시간 간격(10:40·13:40·16:40·19:40·22:40·01:40·04:40 KST). 뉴스·검색어 페이지처럼 자료가
    # 들어오는 대로 페이지를 갱신한다(2026-09-16 요청). 변경이 없으면 발행 단계가 그냥 끝난다.
    - cron: "40 1,4,7,10,13,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: ECOS 소비자물가 통계표 탐색 (수동 실행 때만)
        if: github.event_name == 'workflow_dispatch'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          # 한국 CPI 의 ECOS 코드를 확정하려는 것이다. 지금 기본값(901Y009/0)이 실패해 FRED 의
          # OECD 계열(2023-11 에서 끝남)로 대체돼 있다. 로그에 나온 표·항목 코드를
          # ECOS_CPI_STAT_CODE / ECOS_CPI_ITEM_CODE 로 넣으면 실질금리차가 다시 갱신된다.
          python tools/probe_ecos.py 소비자물가 || true
      - name: 보고서 생성
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/build_macro_report.py --write
      - name: 발행
        run: |
          # 다른 워크플로(검색어·AI 뉴스 등)가 같은 시각에 push 하면 거부된다(2026-09-16 실제로
          # 겪었다). 거부되면 원격을 받아 rebase 한 뒤 다시 민다. 이 워크플로가 바꾸는 파일은
          # docs/macro 와 거시 자료 보관본뿐이라 다른 워크플로와 겹치지 않아 충돌은 없다.
          if [ -z "$(git status --porcelain docs/macro macro_history)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/macro macro_history
          git commit -m "macro: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') KST"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "발행 완료 (시도 $attempt)"; exit 0; fi
            echo "push 거부 — 원격을 받아 다시 시도 ($attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 10))
          done
          echo "5회 시도 후 실패"; exit 1
