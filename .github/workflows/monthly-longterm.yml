name: 장기 전망·영업이익 추정 (주간)

# 반도체 수출액·선행지수 순환변동치와 3·6·12개월 수익률을 다시 계산해
# docs/<종목>/longterm.html 조각으로 올린다. 매일 보고서가 그 조각을 맨 아래 절로 붙인다.
# 실패하면 지난번 조각이 그대로 남는다(매일 보고서는 멈추지 않는다).
on:
  schedule:
    # 매주 월요일 07:00 KST. 입력이 월간 통계라 값이 자주 바뀌지는 않지만, 발표 시점이
    # 지표마다 다르다 — OECD 선행지수는 매달 중순에 나와 7일 회차만으로는 최대 3주 늦었다(2026-09-20).
    - cron: "0 22 * * 0"
    # 매달 7일 07:00 KST. 전월 수출액(관세청 1일 발표)이 KOSIS에 실리는 시점 바로 뒤라,
    # 월요일 회차와 최대 6일 어긋날 수 있는 이 지표만 제때 받기 위해 남겨 둔다.
    - cron: "0 22 6 * *"
    # 관세청 10일 단위 잠정치 발표일. 1~10일치는 11일, 1~20일치는 21일, 1~말일치는 익월 1일 오전에 나온다.
    # 매일 09:30 KST 에 돌리되, 아래 게이트가 보관본에 새 회차가 없으면 1분 안에 끝낸다. 발표가 휴일로
    # 며칠 미뤄져도 받을 때까지 매일 다시 본다(2026-09-23 요청). 원래 일요일·7일 회차만으로는 발표와 최대
    # 열흘 어긋났고, 발표일+이틀만으로는 사흘 넘게 늦어지면 놓쳤다.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "게이트를 무시하고 무조건 다시 만든다"
        type: boolean
        default: false

permissions:
  contents: write

# 7일이 월요일이면 두 스케줄이 같은 시각에 걸린다. 같은 파일을 동시에 발행하지 않도록 줄을 세운다.
concurrency:
  group: longterm-report
  cancel-in-progress: false

jobs:
  longterm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 두 종목이 같은 KOSIS 키로 동시에 조회하면 한쪽이 거절된다(첫 실행에서 삼성전자만 실패).
      # 잡당 2분이라 순차로 돌려도 부담이 없다.
      max-parallel: 1
      matrix:
        target: [samsung, sk_hynix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 발표 확인 (잠정치 발표일 회차만)
        id: gate
        # 예약 실행 중 발표일 회차(분 == 30)는 새 잠정치가 보관본에 없을 때만 진행한다. 일요일·7일 회차와
        # 수동 실행(force 포함)은 게이트를 건너뛴다. 아직 의존성을 안 깔았으므로 pandas 만 따로 깐다.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%M)" = "30" ]; then
            pip install -q pandas
            if python tools/customs_release_gate.py; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 의존성 설치
        if: steps.gate.outputs.run == 'true'
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0
      - name: 장기 전망 계산·발행
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 뉴스심리지수·장단기 금리차(한국은행 ECOS). 없거나 실패하면 그 요소만 빼고 진행한다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/build_longterm_report.py --target ${{ matrix.target }} --out runs/longterm --dump --publish

      # 영업이익 나우캐스트. 이력은 DART에서 받거나 macro_inputs CSV로 넣는다.
      # 실패해도 장기 전망 결과는 이미 발행되었으므로 이 단계만 경고로 남긴다.
      - name: 이번 분기 영업이익 추정·발행
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/build_earnings_forecast.py --target ${{ matrix.target }} --out runs/earnings --dump --publish
