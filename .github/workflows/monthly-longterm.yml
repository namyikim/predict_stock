name: 장기 전망·영업이익 추정 (월간)

# 반도체 수출액·선행지수 순환변동치와 3·6·12개월 수익률을 월 1회 다시 계산해
# docs/<종목>/longterm.html 조각으로 올린다. 매일 보고서가 그 조각을 맨 아래 절로 붙인다.
# 매달 6일 22:00 UTC(= 7일 07:00 KST): 전월 수출액(관세청 1일 발표)이 KOSIS에 실리는 시점을 지난 뒤.
# 실패하면 이전 달 조각이 그대로 남는다(매일 보고서는 멈추지 않는다).
on:
  schedule:
    - cron: "0 22 6 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  longterm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 두 종목이 같은 KOSIS 키로 동시에 조회하면 한쪽이 거절된다(첫 실행에서 삼성전자만 실패).
      # 잡당 2분이라 순차로 돌려도 부담이 없다.
      max-parallel: 1
      matrix:
        target: [samsung, sk_hynix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0
      - name: 장기 전망 계산·발행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 뉴스심리지수·장단기 금리차(한국은행 ECOS). 없거나 실패하면 그 요소만 빼고 진행한다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/build_longterm_report.py --target ${{ matrix.target }} --out runs/longterm --dump --publish

      # 영업이익 나우캐스트. 이력은 DART에서 받거나 macro_inputs CSV로 넣는다.
      # 실패해도 장기 전망 결과는 이미 발행되었으므로 이 단계만 경고로 남긴다.
      - name: 이번 분기 영업이익 추정·발행
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/build_earnings_forecast.py --target ${{ matrix.target }} --out runs/earnings --dump --publish
