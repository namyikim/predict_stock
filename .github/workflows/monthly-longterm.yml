name: 수출 통계·장기 전망·영업이익 일일 갱신

on:
  schedule:
    # 매일 10:17 KST. 10일/20일/월말 통계 발표 후 하루 한 번 확인한다.
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monthly-longterm.yml"
      - "tools/export_refresh.py"
      - "tools/refresh_longterm_tab.py"
      - "tools/build_longterm_report.py"
      - "tools/valuation_reference.py"
      - "valuation_assumptions.json"
      - "tools/build_earnings_forecast.py"

permissions:
  contents: write
  pages: write

# 수동 실행과 일일 실행이 겹쳐도 앞 실행을 취소하지 않는다.
concurrency:
  group: longterm-report
  cancel-in-progress: false

jobs:
  longterm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 두 종목이 같은 KOSIS 키로 동시에 조회하면 한쪽이 거절된다(첫 실행에서 삼성전자만 실패).
      # 잡당 2분이라 순차로 돌려도 부담이 없다.
      max-parallel: 1
      matrix:
        target: [samsung, sk_hynix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치
        run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 yfinance==1.7.0
      # 영업이익 나우캐스트. 이력은 DART에서 받거나 macro_inputs CSV로 넣는다.
      # 실적 예상이 저장한 수출 스냅샷을 장기 전망도 그대로 사용한다.
      - name: 이번 분기 영업이익 추정·발행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/build_earnings_forecast.py --target ${{ matrix.target }} --out runs/earnings --dump --publish

      - name: 장기 전망 계산·발행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 관세청 품목별 수출입실적(공공데이터포털). KOSIS보다 빠른 원천이다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 뉴스심리지수·장단기 금리차(한국은행 ECOS). 없거나 실패하면 그 요소만 빼고 진행한다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/build_longterm_report.py --target ${{ matrix.target }} --out runs/longterm --dump --publish --exports-snapshot runs/earnings/${{ matrix.target }}/exports_snapshot.json

      - name: 종합 보고서의 장기 전망 탭 갱신
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/refresh_longterm_tab.py --target ${{ matrix.target }} --earnings runs/earnings --longterm runs/longterm --publish

      - name: Pages 재빌드 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/export-pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds")
          case "$code" in
            200|201|409) echo "Pages 재빌드 요청 완료 또는 이미 진행 중" ;;
            *) echo "::error::Pages 재빌드 요청 실패 ($code)"; exit 1 ;;
          esac
