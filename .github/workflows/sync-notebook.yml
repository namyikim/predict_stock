name: Colab 노트북 소스 동기화

on:
  push:
    branches: [main]
    paths:
      - "forecast_utils.py"
      - "macro_utils.py"
      - "report_html.py"
      - "data_sources/**"
      - "tools/sync_notebook_helpers.py"
      - ".github/workflows/sync-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-colab-notebook
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 노트북에 최신 헬퍼 반영
        run: python tools/sync_notebook_helpers.py
      - name: 변경된 노트북 커밋
        run: |
          if git diff --quiet -- samsung_direction_model_colab.ipynb; then
            echo "노트북 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add samsung_direction_model_colab.ipynb
          git commit -m "Sync Colab notebook helpers"
          git push
