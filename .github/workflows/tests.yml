name: 테스트

# 코드가 바뀌면 먼저 테스트를 돌린다. 지금까지는 테스트가 253개 있어도 자동으로 실행되지 않아,
# 바뀐 코드가 바로 아침 보고서에 들어갔다. 노트북 전체 실행 테스트(약 100초)까지 포함한다 —
# 셀 순서·변수 이름 오류는 그것만 잡는다.
on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "forecast_history/**"
      - "macro_history/**"
      - "runs/**"
      - "**.md"
      # 아래는 일일 보고서가 push 로 도는 경로다. 그 실행의 validation 작업이 이 워크플로를 불러 같은 테스트를
      # 같은 동시성 그룹(tests-<ref>)에서 돌리므로, 여기서 따로 돈 실행은 매번 취소됐다(2026-09-28~30: 13회 중 12회).
      # 이 경로만 바뀐 push 는 그쪽에 맡긴다. 테스트 파일 등 다른 파일이 함께 바뀌면 여기서도 돈다.
      # 일일 보고서의 push 경로를 바꾸면 여기도 같이 바꾼다(tests/test_workflow_triggers.py 가 확인한다).
      - "samsung_direction_model_colab.ipynb"
      - "forecast_utils.py"
      - "macro_utils.py"
      - "data_sources/**"
      - "report_html.py"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/daily-report.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 수급 경로에 쓰인다. pandas 제약이 requirements와 충돌해 따로 넣는다.
          pip install --no-deps pykrx==1.2.8 deprecated multipledispatch || echo "::warning::pykrx 설치 실패"
      - name: 테스트
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
