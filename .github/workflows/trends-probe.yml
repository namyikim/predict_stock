name: 구글 트렌드 접근 시험

# 구글 트렌드 시계열은 공식 API가 없어 웹 UI의 내부 엔드포인트를 써야 한다.
# 로컬에서는 되지만 클라우드 IP는 막히는 일이 흔하다. 실제 기능을 만들기 전에
# GitHub 러너에서 되는지부터 확인하는 일회성 시험이다.
#
# 결과에 따라:
#   성공 -> 장기 검색 관심도 보고서를 구글 트렌드로도 만들 수 있다
#   실패 -> 이 워크플로와 tools/probe_google_trends.py 를 지운다
#           (위키백과 기반 장기 관심도 보고서는 그대로 쓴다)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        # 표준 라이브러리만 쓴다(pytrends는 pandas까지 끌고 온다).

      - name: 러너 IP 확인
        run: curl -sS https://api.ipify.org || true

      - name: 구글 트렌드 접근 시험
        run: python tools/probe_google_trends.py 반도체 인공지능 HBM 엔비디아 파운드리
